
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads | Marcos Moscoso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #d4af37;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #bbbbbb;
            margin-bottom: 25px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        a, button {
            background: #d4af37;
            color: #0d0d0d;
            border: none;
            border-radius: 5px;
            padding: 11px 16px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        a:hover, button:hover {
            background: #f0c84b;
        }

        .resumo {
            background: #181818;
            border: 1px solid #333333;
            border-left: 4px solid #d4af37;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .resumo span {
            color: #d4af37;
            font-size: 26px;
            font-weight: bold;
        }

        .tabela-container {
            width: 100%;
            overflow-x: auto;
            background: #181818;
            border: 1px solid #333333;
            border-radius: 8px;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #333333;
            vertical-align: top;
        }

        th {
            background: #222222;
            color: #d4af37;
        }

        td {
            color: #eeeeee;
        }

        tr:hover td {
            background: #202020;
        }

        #status {
            color: #bbbbbb;
            margin: 18px 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="topo">
        <div>
            <h1>Leads recebidos</h1>
            <p class="subtitulo">Contatos enviados pelo formulário da imobiliária.</p>
        </div>

        <div>
            <a href="dashboard.html">Voltar ao painel</a>
            <button type="button" onclick="carregarLeads()">Atualizar</button>
        </div>
    </div>

    <div class="resumo">
        Total de contatos: <span id="totalLeads">0</span>
    </div>

    <p id="status">Carregando contatos...</p>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Interesse</th>
                    <th>Mensagem</th>
                </tr>
            </thead>

            <tbody id="listaLeads">
                <tr>
                    <td colspan="5">Carregando...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        async function carregarLeads() {
            const lista = document.getElementById('listaLeads');
            const total = document.getElementById('totalLeads');
            const status = document.getElementById('status');

            status.textContent = 'Carregando contatos...';

            try {
                const resposta = await fetch(`${API_URL}/leads`);

                if (!resposta.ok) {
                    throw new Error('Não foi possível consultar os contatos.');
                }

                const leads = await resposta.json();

                total.textContent = leads.length;
                lista.innerHTML = '';

                if (leads.length === 0) {
                    lista.innerHTML = `
                        <tr>
                            <td colspan="5">Nenhum contato cadastrado.</td>
                        </tr>
                    `;
                    status.textContent = 'Consulta concluída.';
                    return;
                }

                leads.forEach(lead => {
                    const linha = document.createElement('tr');

                    [
                        lead.nome,
                        lead.email,
                        lead.telefone,
                        lead.interesse,
                        lead.mensagem
                    ].forEach(valor => {
                        const celula = document.createElement('td');
                        celula.textContent = valor || '-';
                        linha.appendChild(celula);
                    });

                    lista.appendChild(linha);
                });

                status.textContent = 'Contatos carregados com sucesso.';
            } catch (erro) {
                console.error('Erro ao carregar leads:', erro);
                total.textContent = '—';
                lista.innerHTML = `
                    <tr>
                        <td colspan="5">
                            Não foi possível carregar os contatos.
                            Verifique se o servidor Flask está ligado.
                        </td>
                    </tr>
                `;
                status.textContent = 'Erro ao consultar os contatos.';
            }
        }

        carregarLeads();
    </script>
</body>
</html>
