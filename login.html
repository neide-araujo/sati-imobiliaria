<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador</title>
    <style>
        body{
            background:#f0f0f0;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .caixa{
            background:white;
            padding:30px;
            border-radius:12px;
            width:320px;
            box-shadow: 0 0 10px #00000020;
        }
        h2{
            text-align:center;
        }
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            box-sizing:border-box;
            border:1px solid #ccc;
            border-radius:6px;
        }
        button{
            width:100%;
            padding:12px;
            background:#2277dd;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <h2>Entrar</h2>
        <input type="email" id="email" placeholder="Digite seu e-mail">
        <input type="password" id="senha" placeholder="Digite sua senha">
        <button onclick="entrar()">Entrar</button>
    </div>

    <script>
        function entrar(){
    const email = document.getElementById("email").value
    const senha = document.getElementById("senha").value

    if(email === "marcoscmoscoso@hotmail.com" && senha === "Moscoso123"){
        alert("Login correto! Bem-vindo, Admin!")
        window.location.href = "../admin/dashboard.html"
        
    }else{
        alert("E-mail ou senha incorretos!")
    }
}    
        
    </script>
</body>
</html>
